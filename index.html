<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CourierGo Admin · Driver Verification</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'Inter',sans-serif;background:#f4f4f5;color:#18181b;}
button{font-family:inherit;}

/* ── Sign in ── */
#signin-gate{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;z-index:300;}
.signin-logo{width:64px;height:64px;border-radius:16px;background:#18181b;display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
.signin-logo i{color:#fff;font-size:26px;}
.signin-title{font-size:22px;font-weight:900;letter-spacing:-0.4px;}
.signin-sub{font-size:13px;color:#71717a;margin:8px 0 28px;text-align:center;max-width:280px;line-height:1.5;}
.google-btn{display:flex;align-items:center;gap:10px;background:#18181b;color:#fff;padding:13px 22px;border-radius:12px;font-size:13px;font-weight:700;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.18);}
.google-btn img{width:18px;height:18px;filter:brightness(0) invert(1);}

/* ── App shell ── */
#app{display:none;min-height:100vh;}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e4e4e7;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-icon{width:34px;height:34px;border-radius:9px;background:#18181b;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;}
.brand-text{font-size:14.5px;font-weight:800;letter-spacing:-0.2px;}
.brand-sub{font-size:10.5px;color:#a1a1aa;font-weight:600;letter-spacing:0.3px;}
.admin-area{display:flex;align-items:center;gap:10px;}
.admin-email{font-size:11.5px;color:#71717a;font-weight:600;}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid #e4e4e7;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#52525b;font-size:12px;}

main{max-width:920px;margin:0 auto;padding:18px 16px 80px;}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
.stat-card{background:#fff;border-radius:14px;padding:13px;border:1px solid #e4e4e7;}
.stat-val{font-size:19px;font-weight:800;}
.stat-lbl{font-size:9.5px;color:#a1a1aa;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;margin-top:2px;}

/* Filter pills */
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.filter-pill{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1.5px solid #e4e4e7;background:#fff;font-size:11.5px;font-weight:700;color:#71717a;cursor:pointer;white-space:nowrap;}
.filter-pill.active{background:#18181b;border-color:#18181b;color:#fff;}

/* Application cards */
.app-card{background:#fff;border:1px solid #e4e4e7;border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .12s;}
.app-card:hover{border-color:#a1a1aa;}
.app-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
.app-name{font-size:14px;font-weight:800;}
.app-meta{font-size:11px;color:#a1a1aa;margin-top:2px;}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;}
.badge{font-size:9px;font-weight:800;letter-spacing:0.2px;text-transform:uppercase;padding:4px 8px;border-radius:999px;}
.badge-pending{background:#fffbeb;color:#b45309;}
.badge-approved{background:#f0fdf4;color:#15803d;}
.badge-rejected{background:#fef2f2;color:#b91c1c;}
.badge-notstarted{background:#f1f5f9;color:#475569;}
.badge-sent{background:#eff6ff;color:#1d4ed8;}
.badge-inreview{background:#fef9c3;color:#854d0e;}
.badge-verified{background:#f0fdf4;color:#15803d;}
.badge-declined{background:#fef2f2;color:#b91c1c;}
.app-bottom{display:flex;align-items:center;gap:14px;font-size:11px;color:#71717a;font-weight:500;}
.app-bottom i{width:13px;text-align:center;color:#a1a1aa;}

.empty-state{text-align:center;padding:60px 20px;color:#a1a1aa;}
.empty-state i{font-size:30px;opacity:0.3;margin-bottom:10px;display:block;}
.empty-state p{font-size:13px;}

/* ── Detail drawer ── */
#detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:150;opacity:0;pointer-events:none;transition:opacity .25s;}
#detail-overlay.open{opacity:1;pointer-events:auto;}
#detail-drawer{position:fixed;top:0;right:-100%;bottom:0;width:min(420px,92vw);background:#fff;z-index:160;transition:right .32s cubic-bezier(.32,0,.67,0);display:flex;flex-direction:column;overflow:hidden;}
#detail-drawer.open{right:0;}
.dd-header{padding:20px;border-bottom:1px solid #f1f1f4;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0;}
.dd-name{font-size:17px;font-weight:800;}
.dd-sub{font-size:11.5px;color:#a1a1aa;margin-top:3px;}
.dd-close{width:30px;height:30px;border-radius:50%;background:#f4f4f5;border:none;cursor:pointer;color:#52525b;font-size:12px;}
.dd-body{flex:1;overflow-y:auto;padding:20px;}
.dd-section-title{font-size:10.5px;font-weight:700;color:#a1a1aa;text-transform:uppercase;letter-spacing:0.4px;margin:18px 0 10px;}
.dd-section-title:first-child{margin-top:0;}
.dd-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f4f4f5;font-size:12.5px;}
.dd-row:last-child{border-bottom:none;}
.dd-row-label{color:#a1a1aa;font-weight:500;}
.dd-row-val{font-weight:700;text-align:right;max-width:60%;}
.dd-footer{padding:16px 20px 28px;border-top:1px solid #f1f1f4;flex-shrink:0;display:flex;flex-direction:column;gap:8px;}
.dd-btn{width:100%;padding:13px;border-radius:13px;border:none;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.dd-btn-primary{background:#18181b;color:#fff;}
.dd-btn-secondary{background:#f4f4f5;color:#18181b;}
.dd-btn-approve{background:#f0fdf4;color:#15803d;border:1.5px solid #bbf7d0;}
.dd-btn-reject{background:#fef2f2;color:#b91c1c;border:1.5px solid #fecaca;}
.dd-btn:disabled{opacity:0.5;cursor:not-allowed;}
.verif-banner{padding:12px 14px;border-radius:12px;font-size:11.5px;font-weight:600;line-height:1.5;margin-bottom:4px;}
.verif-banner.notstarted{background:#f1f5f9;color:#475569;}
.verif-banner.sent{background:#eff6ff;color:#1d4ed8;}
.verif-banner.inreview{background:#fef9c3;color:#854d0e;}
.verif-banner.approved{background:#f0fdf4;color:#15803d;}
.verif-banner.declined{background:#fef2f2;color:#b91c1c;}

/* Toasts */
#toast-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:380px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
.toast{width:100%;padding:13px 15px;border-radius:14px;font-size:12.5px;display:flex;align-items:flex-start;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,0.14);opacity:0;transform:translateY(8px);transition:opacity .28s,transform .28s;pointer-events:auto;background:#fff;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.hide{opacity:0;transform:translateY(8px);}
.toast-success{border:1.5px solid #bbf7d0;color:#15803d;}
.toast-error{border:1.5px solid #fecaca;color:#b91c1c;}
.toast-info{border:1.5px solid #bfdbfe;color:#1d4ed8;}
.toast-title{font-weight:700;}
.toast-msg{opacity:0.8;margin-top:2px;}
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- ══ Sign-in ══ -->
<div id="signin-gate">
    <div class="signin-logo"><i class="fa-solid fa-shield-halved"></i></div>
    <div class="signin-title">CourierGo Admin</div>
    <div class="signin-sub">Review driver applications and run identity verification.</div>
    <button class="google-btn" onclick="signInWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Continue with Google
    </button>
</div>

<!-- ══ App ══ -->
<div id="app">
    <header>
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-truck-fast"></i></div>
            <div>
                <div class="brand-text">CourierGo Admin</div>
                <div class="brand-sub">DRIVER VERIFICATION</div>
            </div>
        </div>
        <div class="admin-area">
            <span class="admin-email" id="admin-email">—</span>
            <button class="icon-btn" onclick="signOutAdmin()" title="Sign out"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>
    </header>

    <main>
        <div class="stats-row">
            <div class="stat-card"><div class="stat-val" id="stat-total">0</div><div class="stat-lbl">Total</div></div>
            <div class="stat-card"><div class="stat-val" id="stat-pending">0</div><div class="stat-lbl">Pending</div></div>
            <div class="stat-card"><div class="stat-val" id="stat-verified">0</div><div class="stat-lbl">Verified</div></div>
            <div class="stat-card"><div class="stat-val" id="stat-approved">0</div><div class="stat-lbl">Approved</div></div>
        </div>

        <div class="filters" id="filters">
            <button class="filter-pill active" data-filter="all" onclick="setFilter('all')">All</button>
            <button class="filter-pill" data-filter="pending" onclick="setFilter('pending')">Pending review</button>
            <button class="filter-pill" data-filter="needs_verification" onclick="setFilter('needs_verification')">Needs verification</button>
            <button class="filter-pill" data-filter="sent" onclick="setFilter('sent')">Link sent</button>
            <button class="filter-pill" data-filter="verified" onclick="setFilter('verified')">Verified</button>
            <button class="filter-pill" data-filter="approved" onclick="setFilter('approved')">Approved</button>
            <button class="filter-pill" data-filter="rejected" onclick="setFilter('rejected')">Rejected</button>
        </div>

        <div id="list"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fa-solid fa-inbox"></i>
            <p>No applications in this view.</p>
        </div>
    </main>
</div>

<!-- ══ Detail drawer ══ -->
<div id="detail-overlay" onclick="closeDetail()"></div>
<div id="detail-drawer">
    <div class="dd-header">
        <div>
            <div class="dd-name" id="dd-name">—</div>
            <div class="dd-sub" id="dd-sub">—</div>
        </div>
        <button class="dd-close" onclick="closeDetail()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="dd-body" id="dd-body">
        <!-- populated by renderDetail() -->
    </div>
    <div class="dd-footer" id="dd-footer">
        <!-- populated by renderDetail() -->
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import {
    getDatabase, ref, onValue, update
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

/* ════════════════════════════════════════════════════
   CONFIG — replace the placeholders below
════════════════════════════════════════════════════ */

// Same Firebase project as CourierGo
const firebaseConfig = {
    apiKey:            "AIzaSyBQSPwpVbGrdCuOoyitAeWQHIeipj2MgIY",
    authDomain:        "newstart-64c43.firebaseapp.com",
    databaseURL:       "https://newstart-64c43-default-rtdb.firebaseio.com",
    projectId:         "newstart-64c43",
    storageBucket:     "newstart-64c43.firebasestorage.app",
    messagingSenderId: "941619830061",
    appId:             "1:941619830061:web:de9e0f791eb8f6eacf87a4"
};

// Only these signed-in Google accounts can access this dashboard
const ADMIN_EMAILS = [
    "lordmade100@gmail.com"
];

// Didit (https://business.didit.me) -- you create each verification session manually
// on Didit's own dashboard (workflow: https://verify.didit.me/u/aSfXcMBVRjiFst6QwGpUvA),
// then paste the resulting link into this admin dashboard. No Didit API key is used here.

// EmailJS (https://emailjs.com) — used to send the verification link, no backend required
const EMAILJS_PUBLIC_KEY  = "GNdk7XXIPtFVWGjsV";
const EMAILJS_SERVICE_ID  = "service_lt6v0kd";
const EMAILJS_TEMPLATE_ID = "template_9b1pvc9";
// Your EmailJS template should use these variables: {{to_email}} {{to_name}} {{verification_link}}

/* ════════════════════════════════════════════════════ */

const fbApp    = initializeApp(firebaseConfig);
const auth     = getAuth(fbApp);
const database = getDatabase(fbApp);
const provider = new GoogleAuthProvider();

if (window.emailjs) emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

let applications = {};   // uid -> application object
let currentFilter = 'all';
let activeDetailUid = null;

function showToast(type, title, msg, duration = 4200) {
    const icons = { success:'fa-circle-check', error:'fa-circle-xmark', info:'fa-circle-info' };
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.innerHTML = `<i class="fa-solid ${icons[type]} toast-icon" style="margin-top:1px;"></i>
        <div><div class="toast-title">${title}</div>${msg ? `<div class="toast-msg">${msg}</div>` : ''}</div>`;
    document.getElementById('toast-container').appendChild(t);
    requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
    setTimeout(() => { t.classList.add('hide'); t.addEventListener('transitionend', () => t.remove(), { once:true }); }, duration);
}

/* ── Auth ── */
window.signInWithGoogle = async function() {
    try { await signInWithPopup(auth, provider); }
    catch(e) { if (e.code !== 'auth/popup-closed-by-user') showToast('error','Sign-in failed', e.message); }
};
window.signOutAdmin = async function() { await fbSignOut(auth); };

onAuthStateChanged(auth, (user) => {
    if (user && ADMIN_EMAILS.includes((user.email||'').toLowerCase())) {
        document.getElementById('signin-gate').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('admin-email').textContent = user.email;
        attachApplicationsListener();
    } else if (user) {
        showToast('error', 'Not authorized', 'This Google account is not on the admin list.');
        fbSignOut(auth);
    } else {
        document.getElementById('app').style.display = 'none';
        document.getElementById('signin-gate').style.display = 'flex';
    }
});

/* ── Data ── */
function attachApplicationsListener() {
    onValue(ref(database, 'driverApplications'), (snap) => {
        applications = snap.val() || {};
        renderStats();
        renderList();
        if (activeDetailUid) renderDetail(activeDetailUid);
    });
}

function veriStatus(app) {
    return (app.verification && app.verification.status) || 'not_started';
}

function matchesFilter(app, filter) {
    const v = veriStatus(app);
    switch(filter) {
        case 'all': return true;
        case 'pending': return app.status === 'pending';
        case 'needs_verification': return v === 'not_started' || v === 'declined';
        case 'sent': return v === 'sent';
        case 'verified': return v === 'approved';
        case 'approved': return app.status === 'approved';
        case 'rejected': return app.status === 'rejected';
        default: return true;
    }
}

window.setFilter = function(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-pill').forEach(p => p.classList.toggle('active', p.dataset.filter === f));
    renderList();
};

function renderStats() {
    const list = Object.values(applications);
    document.getElementById('stat-total').textContent    = list.length;
    document.getElementById('stat-pending').textContent   = list.filter(a => a.status === 'pending').length;
    document.getElementById('stat-verified').textContent  = list.filter(a => veriStatus(a) === 'approved').length;
    document.getElementById('stat-approved').textContent  = list.filter(a => a.status === 'approved').length;
}

function veriBadge(app) {
    const v = veriStatus(app);
    const meta = {
        not_started: { cls:'badge-notstarted', label:'Not verified' },
        sent:         { cls:'badge-sent',       label:'Verification sent' },
        in_review:    { cls:'badge-inreview',   label:'In review' },
        approved:     { cls:'badge-verified',   label:'ID verified' },
        declined:     { cls:'badge-declined',   label:'ID declined' }
    }[v] || { cls:'badge-notstarted', label:'Not verified' };
    return `<span class="badge ${meta.cls}">${meta.label}</span>`;
}

function statusBadge(app) {
    const cls = { pending:'badge-pending', approved:'badge-approved', rejected:'badge-rejected' }[app.status] || 'badge-pending';
    return `<span class="badge ${cls}">${app.status || 'pending'}</span>`;
}

function fmtDate(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleDateString('en-ZA', { day:'numeric', month:'short', year:'numeric' });
}

function renderList() {
    const listEl  = document.getElementById('list');
    const emptyEl = document.getElementById('empty-state');
    const entries = Object.entries(applications)
        .filter(([uid, app]) => matchesFilter(app, currentFilter))
        .sort((a,b) => (b[1].timestamp||0) - (a[1].timestamp||0));

    if (!entries.length) {
        listEl.innerHTML = '';
        emptyEl.style.display = 'block';
        return;
    }
    emptyEl.style.display = 'none';

    listEl.innerHTML = entries.map(([uid, app]) => `
        <div class="app-card" onclick="openDetail('${uid}')">
            <div class="app-top">
                <div>
                    <div class="app-name">${app.name || 'Unnamed applicant'}</div>
                    <div class="app-meta">${app.vehicleType || '—'} · ${app.city || '—'} · Applied ${fmtDate(app.timestamp)}</div>
                </div>
                <div class="badge-row">${statusBadge(app)}${veriBadge(app)}</div>
            </div>
            <div class="app-bottom">
                <span><i class="fa-solid fa-phone"></i> ${app.phone || '—'}</span>
                <span><i class="fa-solid fa-id-card"></i> ${app.licensePlate || '—'}</span>
            </div>
        </div>
    `).join('');
}

/* ── Detail drawer ── */
window.openDetail = function(uid) {
    activeDetailUid = uid;
    renderDetail(uid);
    document.getElementById('detail-overlay').classList.add('open');
    document.getElementById('detail-drawer').classList.add('open');
};
window.closeDetail = function() {
    activeDetailUid = null;
    document.getElementById('detail-overlay').classList.remove('open');
    document.getElementById('detail-drawer').classList.remove('open');
};

function renderDetail(uid) {
    const app = applications[uid];
    if (!app) { closeDetail(); return; }
    const v = veriStatus(app);

    document.getElementById('dd-name').textContent = app.name || 'Unnamed applicant';
    document.getElementById('dd-sub').textContent  = `Applied ${fmtDate(app.timestamp)} · ${app.vehicleType || '—'}`;

    const bannerMeta = {
        not_started: { cls:'notstarted', text:'No verification link has been sent yet. Create a session on Didit\u2019s dashboard using the details below, paste the link, then send it.' },
        sent:         { cls:'sent',       text:'Verification link sent — check Didit\u2019s dashboard for the outcome, then mark it below.' },
        approved:     { cls:'approved',   text:'You marked this driver\u2019s ID as verified.' },
        declined:     { cls:'declined',   text:'You marked this driver\u2019s ID as declined.' }
    }[v];

    document.getElementById('dd-body').innerHTML = `
        <div class="verif-banner ${bannerMeta.cls}">
            <i class="fa-solid fa-shield-halved" style="margin-right:6px;"></i>${bannerMeta.text}
        </div>

        <div class="dd-section-title">Applicant</div>
        <div class="dd-row"><span class="dd-row-label">Full name</span><span class="dd-row-val">${app.name || '—'}</span></div>
        <div class="dd-row"><span class="dd-row-label">Email</span><span class="dd-row-val">${app.email || '—'}</span></div>
        <div class="dd-row"><span class="dd-row-label">Mobile</span><span class="dd-row-val">${app.phone || '—'}</span></div>
        <div class="dd-row"><span class="dd-row-label">SA ID number</span><span class="dd-row-val">${app.idNumber || '—'}</span></div>
        <div class="dd-row"><span class="dd-row-label">Driver's license</span><span class="dd-row-val">${app.license || '—'}</span></div>

        <div class="dd-section-title">Vehicle</div>
        <div class="dd-row"><span class="dd-row-label">Type</span><span class="dd-row-val">${app.vehicleType || '—'}</span></div>
        <div class="dd-row"><span class="dd-row-label">Make &amp; model</span><span class="dd-row-val">${app.vehicleModel || '—'}</span></div>
        <div class="dd-row"><span class="dd-row-label">Plate</span><span class="dd-row-val">${app.licensePlate || '—'}</span></div>
        <div class="dd-row"><span class="dd-row-label">City / area</span><span class="dd-row-val">${app.city || '—'}</span></div>

        <div class="dd-section-title">Identity verification</div>
        <div class="dd-row"><span class="dd-row-label">Status</span><span class="dd-row-val">${veriBadge(app)}</span></div>
        <div class="dd-row"><span class="dd-row-label">Link sent</span><span class="dd-row-val">${app.verification?.emailSentAt ? fmtDate(app.verification.emailSentAt) : '—'}</span></div>
        <div class="dd-row"><span class="dd-row-label">Last decided</span><span class="dd-row-val">${app.verification?.decidedAt ? fmtDate(app.verification.decidedAt) : '—'}</span></div>

        ${(v === 'not_started' || v === 'declined') ? `
        <div class="dd-section-title">Paste Didit verification link</div>
        <input id="dd-link-input" class="phone-field" style="padding:12px 14px;border:2px solid #e4e4e7;border-radius:12px;font-size:12.5px;width:100%;font-family:'Inter',sans-serif;" type="url" placeholder="https://verify.didit.me/s/..." value="${app.verification?.sessionUrl || ''}">
        <p style="font-size:11px;color:#a1a1aa;margin-top:8px;line-height:1.5;">Create the session for this driver on business.didit.me, copy the link it gives you, paste it here, then send.</p>
        ` : ''}
    `;

    const canSend = v === 'not_started' || v === 'declined';
    const canDecideVerification = v === 'sent';
    const canApproveDriver = v === 'approved' && app.status === 'pending';

    document.getElementById('dd-footer').innerHTML = `
        ${canSend ? `<button class="dd-btn dd-btn-primary" id="btn-send" onclick="sendLinkToDriver('${uid}')"><i class="fa-solid fa-paper-plane"></i> Send link to driver</button>` : ''}
        ${canDecideVerification ? `
            <button class="dd-btn dd-btn-approve" onclick="markVerification('${uid}','approved')"><i class="fa-solid fa-check"></i> Mark ID verified</button>
            <button class="dd-btn dd-btn-reject" onclick="markVerification('${uid}','declined')"><i class="fa-solid fa-xmark"></i> Mark ID declined</button>
        ` : ''}
        ${app.status === 'pending' ? `
            <button class="dd-btn dd-btn-approve" ${canApproveDriver ? '' : 'disabled'} onclick="decideDriver('${uid}','approved')">
                <i class="fa-solid fa-check"></i> Approve driver ${canApproveDriver ? '' : '(verify ID first)'}
            </button>
            <button class="dd-btn dd-btn-reject" onclick="decideDriver('${uid}','rejected')"><i class="fa-solid fa-xmark"></i> Reject driver</button>
        ` : `<div style="text-align:center;font-size:11.5px;color:#a1a1aa;font-weight:600;">Decision recorded: ${app.status}</div>`}
    `;
}

/* ── Manual verification + email actions ── */
window.sendLinkToDriver = async function(uid) {
    const app = applications[uid];
    const btn = document.getElementById('btn-send');
    const linkInput = document.getElementById('dd-link-input');
    const link = linkInput ? linkInput.value.trim() : '';

    if (!link) { showToast('error', 'Paste the link first', 'Create the session on Didit\u2019s dashboard and paste the link before sending.'); return; }
    if (!app.email) { showToast('error', 'No email on file', 'This applicant has no email address saved.'); return; }

    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending…'; }

    try {
        if (!window.emailjs) throw new Error('EmailJS script did not load');
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            to_email: app.email,
            to_name: app.name,
            verification_link: link
        });

        await update(ref(database, `driverApplications/${uid}/verification`), {
            sessionUrl: link,
            status: 'sent',
            emailSentAt: Date.now()
        });

        showToast('success', 'Verification link sent', `Emailed to ${app.email}.`);
    } catch(e) {
        console.error(e);
        showToast('error', 'Could not send email', e.message);
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send link to driver'; }
    }
};

window.markVerification = async function(uid, decision) {
    try {
        await update(ref(database, `driverApplications/${uid}/verification`), {
            status: decision,
            decidedAt: Date.now()
        });
        showToast('success', decision === 'approved' ? 'Marked as verified' : 'Marked as declined');
    } catch(e) {
        showToast('error', 'Could not save', e.message);
    }
};

window.decideDriver = async function(uid, decision) {
    try {
        await update(ref(database, `driverApplications/${uid}`), { status: decision, decidedAt: Date.now() });
        showToast('success', decision === 'approved' ? 'Driver approved' : 'Driver rejected');
        closeDetail();
    } catch(e) {
        showToast('error', 'Could not save decision', e.message);
    }
};
</script>
